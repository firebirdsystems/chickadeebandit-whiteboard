<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whiteboard Widget</title>
  <base href="/run/whiteboard/" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 13px;
      background: #fff;
      color: #111827;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 8px;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    .header-title { font-size: 13px; font-weight: 700; color: #111827; }
    .header-sub   { font-size: 11px; color: #6b7280; }

    #canvas-wrap {
      flex: 1;
      position: relative;
      background: #ffffff;
      overflow: hidden;
    }

    #wb-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #9ca3af;
      font-size: 12px;
    }
    #empty-state svg { opacity: 0.4; }
  </style>
</head>
<body>

<div class="header">
  <span class="header-title">🎨 Whiteboard</span>
  <span class="header-sub" id="stroke-count"></span>
</div>

<div id="canvas-wrap">
  <canvas id="wb-canvas"></canvas>
  <div id="empty-state" style="display:none">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </svg>
    Nothing drawn yet
  </div>
</div>

<script type="module">
const STORE = window.__STORE_URL ?? "";

const canvas = document.getElementById("wb-canvas");
const ctx    = canvas.getContext("2d");
const wrap   = document.getElementById("canvas-wrap");
const empty  = document.getElementById("empty-state");
const count  = document.getElementById("stroke-count");

function setupCanvas() {
  const dpr  = window.devicePixelRatio || 1;
  const rect = wrap.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width  = rect.width  + "px";
  canvas.style.height = rect.height + "px";
  ctx.scale(dpr, dpr);
}

function drawPath(points, color, width) {
  if (!points || points.length < 2) return;
  ctx.beginPath();
  ctx.strokeStyle = color ?? "#000";
  ctx.lineWidth   = width;
  ctx.lineCap     = "round";
  ctx.lineJoin    = "round";
  ctx.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
  ctx.stroke();
}

function renderStrokes(strokes, srcW, srcH) {
  const dpr  = window.devicePixelRatio || 1;
  const dstW = canvas.width  / dpr;
  const dstH = canvas.height / dpr;
  const scaleX = dstW / srcW;
  const scaleY = dstH / srcH;
  const scale  = Math.min(scaleX, scaleY);

  ctx.clearRect(0, 0, dstW, dstH);
  ctx.save();
  ctx.translate((dstW - srcW * scale) / 2, (dstH - srcH * scale) / 2);
  ctx.scale(scale, scale);

  for (const s of strokes) {
    if (s.color === null) {
      ctx.globalCompositeOperation = "destination-out";
      drawPath(s.points, "#000", s.width);
      ctx.globalCompositeOperation = "source-over";
    } else {
      drawPath(s.points, s.color, s.width);
    }
  }

  ctx.restore();
}

async function load() {
  setupCanvas();

  if (!STORE) {
    empty.style.display = "flex";
    return;
  }

  let strokes = [];
  try {
    const res = await fetch(`${STORE}?key=strokes`);
    if (res.ok) {
      const json = await res.json();
      strokes = json.value ? JSON.parse(json.value) : [];
    }
  } catch { /* show empty state */ }

  if (strokes.length === 0) {
    empty.style.display = "flex";
    return;
  }

  // Infer the source canvas dimensions from the stroke coordinates
  let maxX = 0, maxY = 0;
  for (const s of strokes) {
    for (const [x, y] of (s.points ?? [])) {
      if (x > maxX) maxX = x;
      if (y > maxY) maxY = y;
    }
  }
  const srcW = Math.max(maxX + 20, 800);
  const srcH = Math.max(maxY + 20, 600);

  renderStrokes(strokes, srcW, srcH);

  const n = strokes.length;
  count.textContent = n === 1 ? "1 stroke" : `${n} strokes`;
}

load();
</script>
</body>
</html>
